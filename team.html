<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team — MLB Archive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-title"><a href="index.html">MLB Archive</a></div>
    <nav class="site-nav">
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="scores.html">Scores</a>
    </nav>
  </div>
</header>

<main>
  <div class="breadcrumb"><a href="teams.html">Teams</a> / <span id="crumb-name">…</span></div>

  <div id="status" class="state-msg" hidden></div>

  <div id="content" hidden>
    <div class="hero" id="hero">
      <img id="team-logo" class="team-logo" alt="">
      <div class="hero__eyebrow" id="team-league">—</div>
      <h1 class="hero__title" id="team-name">—</h1>
      <div class="hero__meta">
        <span id="team-division">—</span>
      </div>
    </div>

    <section class="block" id="latest-block" hidden>
      <h2 class="block__heading">Latest game</h2>
      <a class="matchup" id="latest-link" href="#"></a>
    </section>

    <section class="block" id="recent-block">
      <h2 class="block__heading" id="recent-heading">Last 5 games</h2>
      <div id="recent-status" class="state-msg" hidden></div>
      <div class="recent-games" id="recent-games" hidden></div>
    </section>

    <section class="block" id="tabs-block">
      <div class="tabs" role="tablist" aria-label="Team sections">
        <button type="button" class="tab is-active" role="tab" id="tab-games" aria-selected="true" aria-controls="panel-games" data-tab="games">Games</button>
        <button type="button" class="tab" role="tab" id="tab-squad" aria-selected="false" aria-controls="panel-squad" data-tab="squad" tabindex="-1">Squad</button>
        <button type="button" class="tab" role="tab" id="tab-standings" aria-selected="false" aria-controls="panel-standings" data-tab="standings" tabindex="-1">Standings</button>
        <button type="button" class="tab" role="tab" id="tab-trophies" aria-selected="false" aria-controls="panel-trophies" data-tab="trophies" tabindex="-1">Trophies</button>
      </div>

      <div class="season-bar" id="season-bar">
        <label for="season-select">Season</label>
        <select id="season-select" aria-label="Season"></select>
      </div>

      <div class="tab-panel" id="panel-games" role="tabpanel" aria-labelledby="tab-games">
        <div id="games-status" class="state-msg" hidden style="padding:20px 0;"></div>
        <div id="games-list"></div>
      </div>

      <div class="tab-panel" id="panel-squad" role="tabpanel" aria-labelledby="tab-squad" hidden>
        <div id="squad-status" class="state-msg" hidden style="padding:20px 0;"></div>
        <div id="squad-body"></div>
      </div>

      <div class="tab-panel" id="panel-standings" role="tabpanel" aria-labelledby="tab-standings" hidden>
        <div id="stand-status" class="state-msg" hidden style="padding:20px 0;"></div>
        <div id="stand-body"></div>
      </div>

      <div class="tab-panel" id="panel-trophies" role="tabpanel" aria-labelledby="tab-trophies" hidden>
        <table class="trophy-table" id="trophy-table"></table>
      </div>
    </section>

    <section class="block" id="history-block">
      <h2 class="block__heading">Franchise history</h2>
      <ul class="timeline" id="name-history"></ul>
    </section>

    <section class="block">
      <h2 class="block__heading">Season by season</h2>
      <p style="font-size:0.88rem;color:var(--text-tertiary);margin-bottom:14px;">
        Loads on demand — checks all 46 seasons for this team's record.
      </p>
      <button class="btn" id="load-seasons-btn">Load season-by-season record</button>
      <div id="seasons-status" class="state-msg" hidden style="padding:20px 0;"></div>
      <div class="table-scroll" id="seasons-wrap" hidden>
        <table class="ledger" id="seasons-table">
          <thead>
            <tr>
              <th class="left">Year</th>
              <th class="left">League</th>
              <th class="left">Division</th>
              <th>W</th>
              <th>L</th>
              <th>Pct</th>
            </tr>
          </thead>
          <tbody id="seasons-body"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script type="module" src="js/app.js"></script>
</body>
</html>
