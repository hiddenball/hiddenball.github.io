<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#14181d">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <div class="site-title"><a class="brand" href="/" aria-label="Hidden Ball"><span class="brand__word" aria-hidden="true">Hidden <span class="brand__ball">Ball</span></span></a></div>
  </div>
</header>
<main>
  <div class="tx-ticker" id="tx-ticker" role="region" aria-label="Recent transactions" hidden>
    <div class="tx-track" id="tx-track"></div>
  </div>
  <section class="block block--today" id="today-block">
    <h2 class="block__heading" id="today-heading">Today's games</h2>
    <div id="today-status" class="state-msg" hidden></div>
    <div id="today-wrap" hidden></div>
  </section>
  <section class="block">
    <h2 class="block__heading" id="standings-heading">Standings</h2>
    <div id="standings-status" class="state-msg" hidden></div>
    <div id="standings-wrap" hidden></div>
  </section>
</main>
<footer class="site-footer">
  <div class="footer-container">
    <p><span class="footer-brand">&copy; <a href="/about/">Hidden Ball</a></span> 2022 | All rights reserved</p>
  </div>
</footer>
<script type="module" src="/js/app.js"></script>
</body>
</html>
