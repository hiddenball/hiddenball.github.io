<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search — MLB Archive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="site-header__inner">
    <div class="site-title"><a href="index.html">MLB Archive</a></div>
    <nav class="site-nav">
      <a href="teams.html">Teams</a>
      <a href="players.html">Players</a>
      <a href="scores.html">Scores</a>
      <a href="search.html">Search</a>
    </nav>
  </div>
</header>

<main>
  <div class="breadcrumb">Search</div>

  <div class="hero hero--compact">
    <h1 class="hero__title">Search the archive</h1>
    <div class="hero__meta">
      <span>Find any player, team, manager, or ballpark by name.</span>
    </div>
  </div>

  <div class="search-controls">
    <input type="text" id="search-input" class="search-input" placeholder="Search by name…" autocomplete="off">
    <div class="filter-chips" id="filter-chips">
      <button class="chip is-active" data-type="all">All</button>
      <button class="chip" data-type="player">Players</button>
      <button class="chip" data-type="team">Teams</button>
      <button class="chip" data-type="manager">Managers</button>
      <button class="chip" data-type="ballpark">Ballparks</button>
    </div>
  </div>

  <div id="status" class="state-msg"></div>

  <div id="results-wrap" hidden>
    <div class="results-count" id="results-count"></div>
    <ul class="result-list" id="result-list"></ul>
  </div>
</main>

<script type="module" src="js/search.js"></script>
</body>
</html>
